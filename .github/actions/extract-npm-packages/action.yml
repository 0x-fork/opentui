name: Extract npm packages
description: Download the release npm packages and put each one where publishing expects it. Optionally run the packed Node smoke tests on them.
inputs:
  artifact:
    description: Name of the npm packages artifact
    required: true
  smoke-test:
    description: Install dependencies and run the packed Node smoke tests
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Before the extraction, which replaces the workspace links of the native packages.
    - name: Install dependencies
      if: inputs.smoke-test == 'true'
      shell: bash
      run: bun install

    - name: Download npm packages artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}

    - name: Extract npm packages
      shell: bash
      run: |
        echo "Extracting npm packages..."
        unzip -q npm-packages.zip

        # Copy core dist
        if [ -d "npm-packages/core-dist" ]; then
          cp -r npm-packages/core-dist packages/core/dist
          echo "Copied core dist"
        fi

        if [ -d "npm-packages/three-dist" ]; then
          cp -r npm-packages/three-dist packages/three/dist
          echo "Copied three dist"
        fi

        if [ -d "npm-packages/qrcode-dist" ]; then
          cp -r npm-packages/qrcode-dist packages/qrcode/dist
          echo "Copied qrcode dist"
        fi

        # Copy native packages to core's node_modules
        if [ -d "npm-packages/core-native-packages" ]; then
          mkdir -p packages/core/node_modules/@opentui

          # Replace Bun-managed symlinks with the packaged native directories.
          rm -rf packages/core/node_modules/@opentui/core-darwin-x64
          rm -rf packages/core/node_modules/@opentui/core-darwin-arm64
          rm -rf packages/core/node_modules/@opentui/core-linux-x64
          rm -rf packages/core/node_modules/@opentui/core-linux-arm64
          rm -rf packages/core/node_modules/@opentui/core-linux-x64-musl
          rm -rf packages/core/node_modules/@opentui/core-linux-arm64-musl
          rm -rf packages/core/node_modules/@opentui/core-win32-x64
          rm -rf packages/core/node_modules/@opentui/core-win32-arm64

          cp -r npm-packages/core-native-packages/* packages/core/node_modules/@opentui/
          echo "Copied native packages"
        fi

        # Copy other package dists
        if [ -d "npm-packages/react-dist" ]; then
          cp -r npm-packages/react-dist packages/react/dist
          echo "Copied react dist"
        fi

        if [ -d "npm-packages/solid-dist" ]; then
          cp -r npm-packages/solid-dist packages/solid/dist
          echo "Copied solid dist"
        fi

        if [ -d "npm-packages/keymap-dist" ]; then
          cp -r npm-packages/keymap-dist packages/keymap/dist
          echo "Copied keymap dist"
        fi

        if [ -d "npm-packages/ssh-dist" ]; then
          cp -r npm-packages/ssh-dist packages/ssh/dist
          echo "Copied ssh dist"
        fi

        echo "Package extraction complete"

    - name: Run packed Node smoke tests
      if: inputs.smoke-test == 'true'
      shell: bash
      run: |
        cd packages/core
        bun run test:dist --skip-build
        cd ../solid
        bun run test:dist --skip-build
        cd ../keymap
        bun run test:dist --skip-build
        cd ../ssh
        bun run test:dist --skip-build
